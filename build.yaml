# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: lily58_left nice_view_adapter nice_view_dual
  # No nice_view_adapter here: it moves P0.17/P0.20 to SPI and disables pro_micro_i2c, which the touchpad needs.
  - board: nice_nano//zmk
    shield: lily58_right
    snippet: zmk-usb-logging
  - board: nice_nano//zmk
    shield: settings_reset
