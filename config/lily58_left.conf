# Central: raises the touchpad events forwarded from the right half
CONFIG_ZMK_POINTING=y

# Custom status screen from zmk-nice-oled, showing both halves' batteries
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_ALL=y

# Lets the left half receive the right half's battery level
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
