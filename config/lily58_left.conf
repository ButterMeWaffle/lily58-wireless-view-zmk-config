# Central: raises the touchpad events forwarded from the right half
CONFIG_ZMK_POINTING=y

# Lets the left half receive the right half's battery level, shown by the nice_view_dual screen
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Name the host (laptop/phone) sees when pairing
CONFIG_ZMK_KEYBOARD_NAME="SamsLily58"
