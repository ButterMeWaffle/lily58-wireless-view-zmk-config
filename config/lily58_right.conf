# Peripheral: I2C for the TPS43, and the pointing/input-split stack to forward its events
CONFIG_ZMK_POINTING=y
CONFIG_I2C=y

# DEBUG: driver debug output; USB serial logging now comes from the zmk-usb-logging snippet in build.yaml (remove both when the touchpad works; logging raises power use)
CONFIG_INPUT_LOG_LEVEL_DBG=y
