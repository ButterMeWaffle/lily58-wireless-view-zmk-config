# Gitea Actions port of zmkfirmware/zmk's build-user-config.yml (reusable workflows and upload-artifact v4+ don't work on Gitea).
# Gitea prefers this folder over .github/workflows, so the GitHub workflow stays untouched.
name: Build ZMK firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  matrix:
    runs-on: ubuntu-latest
    name: Fetch build matrix
    outputs:
      build_matrix: ${{ steps.fetch.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch build matrix
        id: fetch
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          matrix=$(python3 -c 'import json, yaml; print(json.dumps(yaml.safe_load(open("build.yaml")), separators=(",", ":")))')
          echo "build_matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}"

  build:
    runs-on: ubuntu-latest
    needs: matrix
    name: Build
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Ensure node for JS actions
        run: |
          if ! command -v node > /dev/null; then
            apt-get update && apt-get install -y curl unzip
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash && apt-get install -y nodejs
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare variables
        shell: bash
        env:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
          snippet: ${{ matrix.snippet }}
          artifact_name: ${{ matrix.artifact-name }}
        run: |
          echo "build_dir=$(mktemp -d)" >> "$GITHUB_ENV"
          # This repo is a Zephyr module (custom IQS5xx driver), so build from an isolated west workspace.
          new_tmp_dir="${TMPDIR:-/tmp}/zmk-config"
          mkdir -p "${new_tmp_dir}"
          echo "base_dir=${new_tmp_dir}" >> "$GITHUB_ENV"
          if [ -n "${snippet}" ]; then
            echo "extra_west_args=-S \"${snippet}\"" >> "$GITHUB_ENV"
          fi
          echo "extra_cmake_args=${shield:+-DSHIELD=\"$shield\"} -DZMK_EXTRA_MODULES='${GITHUB_WORKSPACE}'" >> "$GITHUB_ENV"
          echo "display_name=${shield:+$shield - }${board}" >> "$GITHUB_ENV"
          echo "artifact_name=${artifact_name:-${shield:+${shield// /_}-}${board//\//_}-zmk}" >> "$GITHUB_ENV"

      - name: Copy config files to isolated directory
        run: |
          mkdir "${{ env.base_dir }}/config"
          cp -R config/* "${{ env.base_dir }}/config/"

      - name: West init
        working-directory: ${{ env.base_dir }}
        run: west init -l "${{ env.base_dir }}/config"

      - name: West update
        working-directory: ${{ env.base_dir }}
        run: west update --fetch-opt=--filter=tree:0

      - name: West zephyr-export
        working-directory: ${{ env.base_dir }}
        run: west zephyr-export

      - name: West build (${{ env.display_name }})
        working-directory: ${{ env.base_dir }}
        shell: sh -x {0}
        run: west build -s zmk/app -d "${{ env.build_dir }}" -b "${{ matrix.board }}" ${{ env.extra_west_args }} -- -DZMK_CONFIG=${{ env.base_dir }}/config ${{ env.extra_cmake_args }} ${{ matrix.cmake-args }}

      - name: Kconfig file
        if: ${{ !cancelled() }}
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/.config" ]; then
            grep -v -e "^#" -e "^$" "${{ env.build_dir }}/zephyr/.config" | sort
          else
            echo "No Kconfig output"
          fi

      - name: Devicetree file
        if: ${{ !cancelled() }}
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/zephyr.dts" ]; then
            cat "${{ env.build_dir }}/zephyr/zephyr.dts"
          else
            echo "No Devicetree output"
          fi

      - name: Rename artifacts
        run: |
          mkdir "${{ env.build_dir }}/artifacts"
          if [ -f "${{ env.build_dir }}/zephyr/zmk.uf2" ]; then
            cp "${{ env.build_dir }}/zephyr/zmk.uf2" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.uf2"
          else
            cp "${{ env.build_dir }}/zephyr/zmk.bin" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.bin"
          fi

      # v3: Gitea doesn't support the v4+ artifact protocol.
      - name: Archive (${{ env.display_name }})
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts
